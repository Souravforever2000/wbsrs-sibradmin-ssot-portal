<app-page-heading
  title="Executive Overview"
  description="A state-wide view of member coverage, scheme matching and data quality."
/>

<app-global-filters />

<div class="page-actions">
  <button class="primary-button">
    <span class="material-symbols-rounded">download</span> Export view
  </button>
  </div>

@if (dashboard$ | async; as dashboard) {
  <section class="kpi-grid">
    <app-kpi-card
      label="Total unique members"
      [value]="dashboard.summary.totalUniqueMembers.toString()"
      detail="Unlogged SRS_master"
      trend="Baseline"
      icon="group"
    />

    <app-kpi-card
      label="Scheme matches checked"
      [value]="dashboard.summary.schemeMatchesChecked.toString()"
      detail="3.0 schemes / member"
      trend="Active"
      tone="blue"
      icon="compare_arrows"
    />

    <app-kpi-card
      label="High match rate (>85%)"
      [value]="dashboard.summary.highMatchRate + '%'"
      detail="137 matching records"
      trend="Strong"
      tone="green"
      icon="check_circle"
    />

    <app-kpi-card
      label="Critical discrepancies"
      [value]="dashboard.summary.criticalDiscrepancies.toString()"
      detail="13.2% requires audit"
      trend="Review"
      tone="red"
      icon="warning"
    />
  </section>

  <app-dashboard-charts
    [gradeDistribution]="dashboard.gradeDistribution"
    [statusBreakdown]="dashboard.statusBreakdown"
    [discrepancyFrequency]="dashboard.discrepancyFrequency"
    [confidenceSpectrum]="dashboard.confidenceSpectrum"
  />
}

<app-dashboard-insights [insights]="insights$ | async" />

<app-district-performance [rows]="performance$ | async" />

<app-state-overview />
