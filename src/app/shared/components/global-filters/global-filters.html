<section class="filters-panel" aria-label="Global filters">
  <div class="filter-heading"><span class="filter-icon">⌕</span><strong>Global filters</strong><small>Applied across analytics</small></div>
  <label><span>Financial year</span><select [ngModel]="state.filters().financialYear" (ngModelChange)="state.update({ financialYear: $event })">@for (year of years; track year) { <option [value]="year">{{ year }}</option> }</select></label>
  <label><span>District</span><select [ngModel]="state.filters().district" (ngModelChange)="state.update({ district: $event, block: 'All blocks' })">@for (district of districts; track district) { <option [value]="district">{{ district }}</option> }</select></label>
  <label><span>Block</span><select [ngModel]="state.filters().block" (ngModelChange)="state.update({ block: $event })">@for (block of blocks; track block) { <option [value]="block">{{ block }}</option> }</select></label>
  <label><span>Scheme</span><select [ngModel]="state.filters().scheme" (ngModelChange)="state.update({ scheme: $event })">@for (scheme of schemes; track scheme) { <option [value]="scheme">{{ scheme }}</option> }</select></label>
  <label class="department-filter"><span>Department</span><select [ngModel]="state.filters().department" (ngModelChange)="state.update({ department: $event })">@for (department of departments; track department) { <option [value]="department">{{ department }}</option> }</select></label>
  <button type="button" class="reset-button" (click)="reset()">⟳ Reset</button>
</section>
